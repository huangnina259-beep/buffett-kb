<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Compounder · 复利国</title>
    <link rel="stylesheet" href="/static/style.css?v=8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Home State -->
        <div id="home-view" class="hero">

            <!-- Language toggle -->
            <button class="lang-toggle lang-toggle--home" onclick="toggleLang()">EN</button>

            <!-- Hidden: preserves JS bindings for updateButtonsState / sendQuery -->
            <div id="home-search-wrap" style="display:none;" aria-hidden="true">
                <input id="home-search-input" type="text" autocomplete="off" />
                <button id="home-submit-btn"></button>
            </div>

            <!-- Brand -->
            <div class="home-brand">
                <div class="home-brand-cn">复利国</div>
                <div class="home-brand-en">The Compounder</div>
            </div>

            <!-- Headline -->
            <h1 class="home-headline" id="home-headline">向大师学习，独立思考。</h1>
            <p class="home-subheadline" id="home-subheadline">探索巴菲特、芒格、霍华德·马克斯和李录的投资智慧。</p>

            <!-- Mode selection cards -->
            <div class="home-cards">
                <div class="home-card" onclick="openChat()">
                    <div class="home-card-title" id="home-card-qa-title">提问投资问题</div>
                    <div class="home-card-desc" id="home-card-qa-desc">探索巴菲特、芒格、马克斯和李录的思想。</div>
                    <div class="home-card-cta" id="home-card-qa-cta">进入问答 →</div>
                </div>
                <div class="home-card" onclick="showCaseSelector()">
                    <div class="home-card-title" id="home-card-train-title">训练你的思维</div>
                    <div class="home-card-desc" id="home-card-train-desc">通过真实商业案例，学习投资大师的思考方式。</div>
                    <div class="home-card-cta" id="home-card-train-cta">浏览案例 →</div>
                </div>
            </div>

            <!-- Footer tag line -->
            <div class="home-footer-line" id="home-footer-line">商业 · 思维 · 风险 · 时间</div>
        </div>

        <!-- Chat State -->
        <div id="chat-view" style="display: none;">
            <header class="chat-header">
                <div class="logo-container" onclick="location.reload()" title="New Conversation">
                    <img src="/static/logo.png" alt="Logo" class="nav-logo">
                    <span class="brand-text">价值投资</span>
                </div>
                <div class="header-actions">
                    <button class="new-chat-btn" onclick="newChat()" title="New Conversation">+ 新对话</button>
                    <button class="lang-toggle" onclick="toggleLang()">EN</button>
                </div>
            </header>

            <div class="chat-container">
                <div id="sidebar" class="sidebar">
                    <div class="sidebar-header">
                        <span id="sidebar-title">来源片段</span>
                        <button class="close-sidebar" onclick="closeSidebar()">✕</button>
                    </div>
                    <div id="sidebar-content"></div>
                </div>
                <div id="chat-main">
                    <!-- Pre-chat landing -->
                    <div id="pre-chat">
                        <h1 class="pre-chat-title" id="pre-chat-title">向大师学习。</h1>
                        <div class="search-wrap pre-chat-search-wrap">
                            <input id="pre-chat-input" class="search-input" type="text"
                                   placeholder="询问任何价值投资相关问题…" autocomplete="off" />
                            <button class="wave-btn active" id="pre-chat-submit-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                            </button>
                        </div>
                        <div class="pre-chat-suggestions">
                            <!-- Populated by applyLang() -->
                        </div>
                    </div>

                    <div id="chat-history"></div>

                    <div class="chat-input-container">
                        <div class="search-wrap">
                            <button class="plus-btn" title="Add files and more">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                            <input id="chat-search-input" class="search-input" type="text" placeholder="继续提问…" autocomplete="off" />
                            <button class="wave-btn" id="chat-submit-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Training View -->
        <div id="training-view" style="display: none;">
            <header class="chat-header">
                <div class="logo-container" onclick="exitTraining()">
                    <img src="/static/logo.png" alt="Logo" class="nav-logo">
                    <span class="brand-text">价值投资</span>
                </div>
                <div class="training-header-right">
                    <span id="training-step-label" class="training-step-label"></span>
                    <button class="lang-toggle" onclick="toggleLang()">EN</button>
                    <button class="training-back-btn" onclick="exitTraining()">← 主页</button>
                </div>
            </header>
            <div id="training-progress-wrap">
                <div id="training-progress-fill"></div>
            </div>
            <div id="training-body"></div>
        </div>
    </div>

    <input type="file" id="file-upload" style="display: none;" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,image/*,.png,.jpg,.jpeg,.webp" />

    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/script.js?v=8"></script>
</body>
</html>
